[package]
name = "bark-asr"
version = "0.1.0"
edition = "2024"
license = "(MIT OR Apache-2.0) AND CC-BY-4.0"
description = "Underdog Bark 3.0 speech to text on ONNX Runtime, straight from model.bark"
repository = "https://github.com/stepupgaming/bark-rs"
readme = "README.md"
keywords = ["speech-to-text", "asr", "parakeet", "onnx", "transcription"]
categories = ["multimedia::audio", "science"]

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.2.0"
constriction = "0.5.0"
half = "2.7.1"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
ort = "2.0.0-rc.15"
rayon = "1.12.0"
realfft = "3.5.1"
rubato = "5.0.1"
serde_json = "1.0.154"

[dev-dependencies]
hound = "3.5.1"
sha2 = "0.11.1"
